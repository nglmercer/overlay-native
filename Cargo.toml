[package]
name = "overlay-native"
version = "0.1.0"
edition = "2021"
default-run = "overlay-native"

[lib]
name = "overlay_native"
path = "src/lib.rs"

[[bin]]
name = "overlay-native"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.83"
tokio = { version = "1.37.0", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "time",
    "macros",
    "net",
    "io-util",
] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.61"
futures = "0.3.30"
tokio-tungstenite = { version = "0.20.1", features = ["native-tls"] }
url = "2.5.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }

[dev-dependencies]
mockall = "0.11.4"
criterion = "0.5.1"
proptest = "1.4.0"

# Windows-specific dependencies
[target."cfg(windows)".dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "windef",
    "libloaderapi",
] }

# Unix-specific dependencies (GTK)
[target."cfg(unix)".dependencies]
gtk = "0.17.1"
gdk = "0.17.1"
glib = "0.17.8"
glib-macros = "0.17.8"
